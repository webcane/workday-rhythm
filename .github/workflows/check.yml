name: Проверка

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Проверить Xcode и Swift
        run: |
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 26.6'
          swift --version | grep -F 'Apple Swift version 6.3.3'
      - name: Проверить стиль Swift
        run: swift format lint --strict --recursive Package.swift Sources Tests
      - name: Проверить имена файлов
        run: ./scripts/check-names.sh
      - name: Собрать проект
        run: swift build
      - name: Запустить тесты
        run: swift test
