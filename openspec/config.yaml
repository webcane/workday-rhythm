schema: spec-driven

context: |
  Проект: Workday Rhythm (workday-rhythm), нативное приложение для macOS.
  Один таймер ведёт весь рабочий день через чередование интервалов фокусирования и отдыха.
  После отдыха он ожидает подтверждения пользователя перед следующим интервалом фокусирования.
  Управление программой доступно через значок в строке меню macOS; настройки открываются в отдельном окне.
  Пишите пользовательские тексты и артефакты OpenSpec на русском языке.

rules:
  specs:
    - Формулируйте требования как наблюдаемое поведение с проверяемыми сценариями.
    - Отдельно описывайте поведение при пропуске времени из-за сна macOS или закрытого приложения, если это влияет на требование.
  tasks:
    - Для каждой задачи укажите способ проверки результата.
